name: Release

# Publishes @cmssy/mcp-server to npm via trusted publishing (OIDC) - no token.
# Trigger by pushing a version tag (e.g. `git tag v0.10.0 && git push origin v0.10.0`)
# or manually via the Actions tab. Authentication comes from the GitHub OIDC
# token, so the npm package must have this repo + this workflow registered as a
# Trusted Publisher (npmjs.com -> package -> Settings -> Trusted Publisher).
# pnpm installs and builds; npm does the publish (single package, no
# workspace: deps to rewrite) so the OIDC path is npm's own.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token npm exchanges for publish rights.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; the node 22 image ships 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # On a tag release the tag must match package.json (source of truth).
      # Manual dispatch publishes the current version as-is.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name=$(node -p "require('./package.json').name")
          v=$(node -p "require('./package.json').version")
          if [ "$tag" != "$v" ]; then
            echo "::error::tag v$tag does not match $name@$v"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # A published client is only useful against the deployed backend, so the
      # last gate before npm is production itself: introspect it and validate
      # every operation this build sends. Releasing ahead of the backend fails
      # here instead of breaking every tool at runtime.
      - name: Introspect production
        run: pnpm fetch-prod-schema
        env:
          CMSSY_API_URL: ${{ vars.CMSSY_API_URL || 'https://api.cmssy.io/graphql' }}

      - name: Every operation is one production accepts
        run: pnpm test operations.validate
        env:
          CMSSY_SCHEMA_FILE: prod-schema.graphql

      # Skips if the current version is already on npm, so re-runs are safe.
      # This repo is public, so the publish carries a provenance attestation.
      - name: Publish
        run: |
          set -e
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already on npm — skipping"
          else
            echo "Publishing $name@$version"
            npm publish --access public --provenance
          fi

      # The registry verifies ownership by reading mcpName out of the published
      # npm tarball, so every step below has to run after the publish above.
      - name: Install mcp-publisher
        run: |
          set -e
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher

      # package.json stays the one source of truth for the version; server.json
      # carries the same number twice and is derived here rather than bumped by
      # hand, so it cannot drift out of a release.
      - name: Derive server.json from package.json
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher validate

      # The registry validates the version against npm, and npm serves a fresh
      # publish with a delay of up to a few minutes. Without this wait the step
      # fails with a 404 on every release and needs a manual re-run.
      - name: Wait until npm serves the published version
        run: |
          set -e
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm"
              exit 0
            fi
            sleep 15
          done
          echo "$name@$version not visible on npm after 10 minutes"
          exit 1

      # OIDC grants io.github.<repository owner>/*, which is the org namespace
      # this repo already sits in. No token to store or rotate. Runs AFTER the
      # npm wait: the registry JWT it mints is short-lived, and v0.79.0 spent
      # six minutes waiting for npm and then published with an expired token.
      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      # Skips when that version is already listed, so re-runs stay safe.
      - name: Publish to the MCP registry
        run: |
          set -e
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          listed=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" \
            | jq -r --arg n "$name" '[.servers[]?.server | select(.name == $n) | .version] | last // ""')
          if [ "$listed" = "$version" ]; then
            echo "$name@$version already in the registry — skipping"
          else
            echo "Publishing $name@$version to the registry"
            ./mcp-publisher publish
          fi

  catalogue:
    needs: publish
    runs-on: ubuntu-latest
    env:
      CMSSY_API_TOKEN: ${{ secrets.CMSSY_DOCS_API_TOKEN }}
      CMSSY_DOCS_WORKSPACE_ID: ${{ vars.CMSSY_DOCS_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish the tool catalogue to the docs
        if: env.CMSSY_API_TOKEN != '' && env.CMSSY_DOCS_WORKSPACE_ID != ''
        run: pnpm catalogue

      - name: Say why the catalogue was skipped
        if: env.CMSSY_API_TOKEN == '' || env.CMSSY_DOCS_WORKSPACE_ID == ''
        run: echo "::warning::the docs catalogue was not refreshed - set vars.CMSSY_DOCS_WORKSPACE_ID and secrets.CMSSY_DOCS_API_TOKEN"
