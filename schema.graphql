  actorKind: AuditLogActorKind!
  createdAt: String!
  diff: JSON
  entityId: String!
  entityName: String!
  entityType: AuditLogEntityType!
  id: String!
  toolName: String
  userId: String
  userName: String
  via: AuditLogVia
  workspaceId: String!
}

type WorkspaceAuditLogConnection {
  hasMore: Boolean!
  items: [WorkspaceAuditLog!]!
  total: Int!
}

type WorkspaceBranding {
  brandName: String
  faviconUrl: String
  logoDarkUrl: String
  logoUrl: String
  ogImageUrl: String
}

"""
The currencies the workspace prices in, resolved the way pricing resolves them - set even when the workspace never saved a cart config.
"""
type WorkspaceCurrencies {
  additionalCurrencies: [String!]!
  defaultCurrency: String!
}

type WorkspaceMemberType {
  email: String
  joinedAt: DateTime
  role: WorkspaceRoleType
  roleId: String!
  scopedGrants: [MemberScopedGrant!]!
  status: String!
  userId: String
}

type WorkspaceMutations {
  create(input: CreateWorkspaceInput!): Workspace!
  delete(id: ID!): Boolean!
  dismissOnboarding: Boolean!
  recalculateAllUsage: Workspace!
  regenerateDraftSecret: String!
  update(id: ID!, input: UpdateWorkspaceInput!): Workspace!
  updateBranding(input: UpdateWorkspaceBrandingInput!): WorkspaceBranding!
  updateEditorialWorkflow(input: UpdateEditorialWorkflowInput!): EditorialWorkflow!
}

type WorkspaceOAuthAppMutations {
  """
  Cuts this workspace out of a member's connected app. The app keeps the member's other workspaces.
  """
  removeWorkspace(grantId: ID!): ID!
}

type WorkspaceOAuthAppQueries {
  list: [OAuthWorkspaceGrant!]!
}

type WorkspaceOnboarding {
  dismissed: Boolean!
  steps: [OnboardingStep!]!
}

type WorkspaceOrganization {
  billing: OrganizationBilling!
  id: ID!

  """
  Set only on the Free plan, and only for its owner and admins: the page, storage, API request or bandwidth limit closest to being hit, from 75% used. Seats and workspaces are left out - Free fills them on day one.
  """
  limitNudge: LimitNudge
  limits: OrganizationLimits!
  memberCount: Int!
  name: String!
  plan: String!
  slug: String!
  usage: PooledUsage!
}

type WorkspaceQueries {
  canAccess(slug: String!): Boolean!
  current: Workspace
  draftSecret: String!
  get(id: ID, organizationSlug: String, slug: String): Workspace
  mine: [Workspace!]!

  """
  Every workspace the caller reaches, by name and organization only. Cheaper than mine.
  """
  mineRefs: [WorkspaceRef!]!
  onboarding: WorkspaceOnboarding!
}

"""
A workspace by name alone, for pickers that need no roles, usage or plan.
"""
type WorkspaceRef {
  id: String!
  name: String!
  organizationId: String!
  organizationName: String
  slug: String!
}

type WorkspaceRole {
  color: String
  description: String
  id: String!
  isDefault: Boolean!
  isSystem: Boolean!
  name: String!
  permissions: [String!]!
  slug: String!
}

type WorkspaceRoleResult {
  message: String!
  role: WorkspaceRoleType
  success: Boolean!
}

type WorkspaceRoleType {
  color: String
  createdAt: DateTime!
  description: String
  id: String!
  isDefault: Boolean!
  isSystem: Boolean!
  name: String!
  permissions: [String!]!
  slug: String!
  updatedAt: DateTime!
}

type WorkspaceSettings {
  branding: WorkspaceBranding!
  defaultLanguage: String!
  editorialWorkflow: EditorialWorkflow!
  enabledLanguages: [String!]!
  i18n: I18nSettings!
}

type WorkspaceUsage {
  apiRequestsUsed: Int!
  bandwidthUsedGb: Float!
  membersCount: Int!
  pagesCount: Int!
  storageUsedMb: Float!
}
