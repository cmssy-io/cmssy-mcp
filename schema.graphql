  """
  How VAT is rounded for the net-price buyers of a Company record: per_line or per_rate. null falls back to the workspace's companyTaxRounding. Applies to carts started after the change.
  """
  setTaxRoundingMethod(id: ID!, method: TaxRoundingMethod): ModelRecord!

  """
  The EU VAT id of a Company record, normalized (spaces, dots and dashes dropped, GR read as EL) and checked against the member state's format. null or empty clears it. A changed id is no longer verified.
  """
  setVatId(id: ID!, vatId: String): ModelRecord!

  """
  Attest that you checked the Company record's VAT id (for example in VIES). A verified EU VAT id of another member state zero-rates the company's orders as reverse charge. expectedVatId is the value you checked; a different stored id is refused with CONFLICT.
  """
  setVatVerified(expectedVatId: String, id: ID!, verified: Boolean!): ModelRecord!
  update(input: UpdateModelRecordInput!): ModelRecord
}

