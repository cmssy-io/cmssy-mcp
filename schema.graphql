Commerce capability PATCH: omitted keys keep their stored values. nameField/imageField/taxRateField are overrides - null clears one so the resolved default applies again; skuField/priceField/inventoryField always hold a key. Every role is graded against the key it RESOLVES to, cleared or not: that field must exist and must be of a type the role can read - a number for priceField/inventoryField, a string-valued type for nameField/skuField/taxRateField (and skuField/taxRateField may not name a translatable field: something reads each of those two without resolving a locale), media, a list of media, text or url for imageField. A role resolving to nothing is refused only where the reader cannot do without it: nameField always, priceField while variantAxes is empty.
