  """
  setPriceDisplayMode(displayMode: PriceDisplayMode, id: ID!): ModelRecord!

  """
  Assign a price list to a record of a Company model, or to a customer without a company; null unassigns. Refused for a customer whose company is live - their company's list prices them.
