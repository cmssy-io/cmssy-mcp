"""
What a buyer pays for one product or variant, in minor units: their list, else the channel's, else the catalogue price.
"""
type BuyerPrice {
  """
  Catalogue unit price before the member's price list. For a variant product asked without variantKey, that of the variant priced lowest.
  """
  basePrice: Int!
  basePriceAmount: TaxedAmount!

  """Channel's currency, else the default."""
  currency: String!
  displayMode: PriceDisplayMode!

  """Quantities must be a multiple of this; 1 when any quantity goes."""
  increment: Int!
  listSource: PriceListSource

  """True when a price list set this price."""
  listed: Boolean!

  """
  Largest quantity this member may put in the cart, never above the cart's per-item cap.
  """
  maxQuantity: Int!

  """
  Smallest quantity this member may put in the cart. For a variant product asked without variantKey, the product-wide value; ask per variant for its own.
  """
  minQuantity: Int!

  """
  Unit price before volume breaks. For a variant product asked without variantKey, the lowest across its variants.
  """
  price: Int!
  priceAmount: TaxedAmount!

  """
  The highest price across the variants, set only when a variant product was asked without variantKey.
  """
  priceMax: Int
  priceMaxAmount: TaxedAmount
  recordId: ID!

  """
  Where price came from: catalogue (no list applies), price_list_entry (a fixed price the list sets, with its own volume breaks in place of the product's) or price_list_percent (the list's percent off the catalogue price and its volume breaks).
  """
  source: PriceSource!
  taxRate: Float!

  """
  Decided before any ship-to address is known, so never export: an export is zero-rated once the cart has a foreign shipping address.
  """
  taxTreatmentKind: TaxTreatmentKind!

  """
  Volume breaks this member gets; empty for a variant product asked without variantKey.
  """
  tiers: [PriceTier!]!
  variantKey: String
}

