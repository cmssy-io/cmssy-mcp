  MINE
}

type AccountQueries {
  """
  A product listing ordered, filtered and paged by the signed-in member's own price - their price list applied, else the catalogue price. Rows are prices only: read the records themselves from the cached, anonymous catalogue (public.model.recordsByIds). A variant product is priced from its lowest variant. filter, stockState, sku and locale work as on public.model.records; a listing that matches more than 2000 products is refused - narrow it with filter. Never cache the response for another visitor.
  """
  catalogPrices(
    channel: String
    filter: JSON
    limit: Int = 20
    locale: String
    modelSlug: String!
    offset: Int = 0

    """
    The workspace draft secret. With it, unpublished records are priced too - for previewing a record before it goes live.
    """
    previewSecret: String

    """Highest price to include, in minor units of the listing's currency."""
    priceMax: Int

    """Lowest price to include, in minor units of the listing's currency."""
    priceMin: Int
    sku: String
    sort: BuyerCatalogSort = PRICE_ASC
    stockState: String
    workspaceId: ID!
  ): BuyerPricePage!
  order(id: ID!, workspaceId: ID!): PublicOrder

  """
  The signed-in member's orders, newest first. scope COMPANY lists every order placed for the member's company and is refused with FORBIDDEN (extensions.reason COMPANY_PERMISSION_REQUIRED, extensions.permission) unless the member's company role grants orders.company.read.
  """
  orders(limit: Int, scope: AccountOrderScope = MINE, skip: Int, workspaceId: ID!): PublicOrderListResult!

  """
  The signed-in member's prices for up to 100 products, one row per item asked; an unknown or hidden product is left out. Read it after the cached, anonymous catalogue has rendered, and never cache the response for another visitor.
  """
  prices(
    channel: String
    items: [PriceQueryItem!]!

    """
    The workspace draft secret. With it, unpublished records are priced too - for previewing a record before it goes live.
    """
    previewSecret: String
    workspaceId: ID!
  ): [BuyerPrice!]!

  """The signed-in member's own account record."""
  profile(workspaceId: ID!): MemberProfile!
}

