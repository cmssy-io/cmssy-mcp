  Sends the stored payload again as a new delivery with its own attempt ladder. The original row is left untouched.
  """
  redeliver(deliveryId: ID!): WebhookDelivery!
  rotateSecret(
    """
    Hours the previous secret keeps signing alongside the new one, capped at 24. Omit or 0 for an immediate cutover, which breaks delivery until the consumer redeploys.
    """
    graceHours: Int
    id: ID!
  ): WebhookEndpointSecret!
  update(input: UpdateWebhookEndpointInput!): WebhookEndpoint!
}

