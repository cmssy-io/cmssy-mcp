type OrderMutations {
  """
  Erase the buyer's personal data from a canceled, closed, fulfilled or refunded order - and from its cart, stored webhook deliveries and Spotlight history. Items, money and the order number stay. Irreversible.
  """
  anonymize(orderId: ID!): Order!

  """
  Anonymize every finished order of one customer: the orders linked to the record plus guest orders placed with its email. Irreversible.
  """
  anonymizeCustomer(customerId: ID!): CustomerAnonymization!

  """Accept a requested return."""
  approveReturn(input: ReturnActionInput!): Order!
  cancel(input: CancelOrderInput!): Order!

  """
  Withdraw a requested or approved return that has no refund. Its units become returnable again.
  """
  cancelReturn(input: ReturnActionInput!): Order!

  """
  Mark an order done. It reopens by itself if a later change leaves it unpaid or not fulfilled.
  """
  close(input: OrderStateInput!): Order!

  """Close a received return without a refund."""
  completeReturn(input: ReturnActionInput!): Order!
  create(input: CreateManualOrderInput!): Order!

  """
  Open a return on the merchant's side. It starts approved; only handed-over units that are not already returned can be listed.
  """
  createReturn(input: CreateReturnInput!): Order!

  """
  Add a parcel carrying some or all of the order's items. fulfillmentStatus, deliveryStatus and state are recomputed in the same write. A new parcel cannot start canceled or returned_to_sender.
  """
  createShipment(input: CreateShipmentInput!): Order!

  """
  Permanently delete a canceled order that took no payment and has no invoice - a test or spam order. Its cart, stored webhook deliveries and Spotlight history lose the buyer's data too. Returns the deleted order's id.
  """
  deleteJunk(orderId: ID!): ID!

  """
  Privileged server-only mutation. Records a payment against an order; it does NOT process or verify a payment. Your backend MUST verify the payment-provider (Stripe, etc.) webhook signature before calling this, and must never expose it to a browser/site-member context. Requires ORDERS_MANAGE.
  """
  markPaid(input: MarkOrderPaidInput!): Order!

  """
  Make the workspace's next order number at least `next`, e.g. 5000001. It can only be raised: numbers already issued keep theirs, and a value at or below the next number is refused. Returns the next number.
  """
  raiseNextNumber(next: Int!): Int!

  """
  Record the goods as arrived. Stock goes up by the restocked units of the returned lines only, in the same write.
  """
  receiveReturn(input: ReceiveReturnInput!): Order!

  """
  Record the invoice an external invoicing system issued for the order. Re-recording the same number is a no-op; a different number is refused.
  """
  recordInvoice(input: RecordOrderInvoiceInput!): Order!

  """
  Record a correction invoice (credit note) issued after the order's invoice, e.g. after a refund. Allowed on canceled and refunded orders; the number must be new to the order.
  """
  recordInvoiceCorrection(input: RecordOrderInvoiceInput!): Order!

  """
  Privileged server-only mutation. Records a (partial) payment up to the order balance; it does NOT process or verify a payment. Your backend MUST verify the payment-provider webhook signature before calling this, and must never expose it to a browser/site-member context. Requires ORDERS_MANAGE.
  """
  recordPayment(input: RecordOrderPaymentInput!): Order!
  refund(input: RefundOrderInput!): Order!

  """
  Record a refund against the return and the order in one write. A received return becomes completed.
  """
  refundReturn(input: RefundReturnInput!): Order!

  """Refuse a requested return. Its units become returnable again."""
  rejectReturn(input: ReturnActionInput!): Order!

  """
  Reopen a closed order. Auto-close leaves it open until it next becomes paid and fulfilled.
  """
  reopen(input: OrderStateInput!): Order!

  """
  Ask the integration that created this parcel to buy its label again, after its booking failed and the order was corrected. The failed parcel becomes canceled and stays as its record; emits shipment.label_requested. cmssy itself buys nothing.
  """
  requestShipmentLabel(input: RequestShipmentLabelInput!): Order!

  """
  Kill the buyer's confirmation-page link (forwarded email, lost device). Irreversible.
  """
  revokeAccessToken(orderId: ID!): Order!

  """
  Attach the order to a customer record, or detach it with a null customerId. The order's contact email stays as it was.
  """
  setCustomer(customerId: ID, orderId: ID!): Order!
  setPipelineStage(input: SetOrderPipelineStageInput!): Order!
  updateDetails(input: UpdateOrderDetailsInput!): Order!
  updateItems(input: EditOrderInput!): Order!

  """Set the carrier and tracking number of the parcel coming back."""
  updateReturnTracking(input: UpdateReturnTrackingInput!): Order!

  """
  Change a parcel's status or tracking. Sending what is already stored changes nothing and sends no webhook. A parcel the carrier has (in_transit, out_for_delivery, delivered, exception) only moves between those or to returned_to_sender. returned_to_sender puts the parcel's units back on sale, once; moving it out takes them off sale again and fails when they are no longer available (sold or reserved meanwhile). A returned parcel cannot be canceled.
  """
  updateShipment(input: UpdateShipmentInput!): Order!
  upsertPipeline(input: UpsertOrderPipelineInput!): OrderPipeline!
}

