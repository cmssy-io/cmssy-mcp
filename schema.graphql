    Filter a product model to the records whose own SKU, or one of whose variants' SKUs, equals this. The record's own SKU is matched only when the delivery API serves its SKU field.
    """
    sku: String
    sort: String

    """
    Filter a product model by availability: "in", "low" or "out". Availability is onHand - reserved, the same rule the admin catalog and the stock badge use.
    """
    stockState: String
    workspaceId: String!
  ): PublicModelRecordList!

  """
  Batch-resolve records referenced by id - the delivery read behind block relation fields. Records come back in the order of ids; an unknown or foreign-workspace id is skipped, so a dangling reference never breaks a page render. Accepts at most 50 ids per call.
  """
  recordsByIds(
    ids: [String!]!

    """
    Language for translatable fields. Their values come back as plain strings, resolved for this language, falling back to the workspace's default language when a translation is missing.
    """
    locale: String

    """
    The workspace draft secret. With it, unpublished records are served too - for previewing a record before it goes live.
    """
    previewSecret: String
    workspaceId: String!
  ): [PublicModelRecord!]!
}

