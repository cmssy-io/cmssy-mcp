  subtotal minus the applied code's discount, re-derived against the current subtotal and clamped to 0. Equals subtotal without a code; a code the cart no longer qualifies for takes 0 off.
  """
  discountedTotal: Int!
  displayMode: PriceDisplayMode!
  id: String!

  """Sum of quantities across all items"""
  itemCount: Int!
